<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tag Extractor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg:       #0a0a0c;
    --surface:  #111114;
    --surface2: #18181c;
    --border:   #222228;
    --text:     #d4d4d8;
    --text-dim: #9b9ba6;
    --accent:   #6366f1;
    --accent-h: #818cf8;
    --radius:   10px;
    --font:     'DM Sans', system-ui, sans-serif;
    --mono:     'JetBrains Mono', monospace;
  }

  html[data-theme="light"] {
    --bg:       #f4f4f6;
    --surface:  #ffffff;
    --surface2: #ececf1;
    --border:   #d9d9e0;
    --text:     #1b1b20;
    --text-dim: #65656f;
    --accent:   #6366f1;
    --accent-h: #4f46e5;
  }

  html, body { min-height: 100%; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased; }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 22px 22px 40px; display: flex; flex-direction: column; min-height: 100vh; }

  /* ── Header ── */
  .app-header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .app-header-icon { display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--accent-h); filter: drop-shadow(0 0 6px rgba(99,102,241,0.5)); }
  .app-header h1 { font-size: 17px; font-weight: 700; color: var(--accent-h); letter-spacing: -0.3px; }
  .spacer { flex: 1; }
  .theme-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; width: 34px; height: 30px; display: inline-flex; align-items: center; justify-content: center; color: var(--text-dim); cursor: pointer; transition: color 0.12s, background 0.12s; flex-shrink: 0; }
  .theme-btn:hover { color: var(--text); background: var(--surface); }
  .theme-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .theme-btn .icon-moon { display: none; }
  html[data-theme="light"] .theme-btn .icon-sun  { display: none; }
  html[data-theme="light"] .theme-btn .icon-moon { display: inline; }

  /* ── Layout ── */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; flex: 1; min-height: 0; }
  @media (max-width: 780px) { .grid { grid-template-columns: 1fr; } }

  .panel { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; min-height: 400px; }
  .panel-head { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .panel-head .label { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); }
  .panel-head .count { font-family: var(--mono); font-size: 11.5px; color: var(--accent-h); background: rgba(99,102,241,0.12); padding: 2px 8px; border-radius: 20px; }

  /* ── Input ── */
  textarea {
    flex: 1; width: 100%; resize: none; border: none; outline: none;
    background: transparent; color: var(--text);
    font-family: var(--mono); font-size: 12.5px; line-height: 1.7;
    padding: 14px;
  }
  textarea::-webkit-scrollbar { width: 7px; }
  textarea::-webkit-scrollbar-thumb { background: #3a3a42; border-radius: 3px; }
  textarea::-webkit-scrollbar-track { background: transparent; }

  /* ── Output: one tag per line, easy to select and copy ── */
  .output { flex: 1; overflow: auto; padding: 14px; }
  .output::-webkit-scrollbar { width: 7px; }
  .output::-webkit-scrollbar-thumb { background: #3a3a42; border-radius: 3px; }
  .output::-webkit-scrollbar-track { background: transparent; }

  .taglist { font-family: var(--mono); font-size: 13px; line-height: 1.9; white-space: pre; }

  .empty { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-dim); font-size: 13px; opacity: 0.6; }

  /* ── Toolbar ── */
  .toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--border); flex-shrink: 0; }

  .btn { padding: 7px 14px; border: none; border-radius: var(--radius); font-family: var(--font); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
  .btn:active { transform: scale(0.97); }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-accent:hover { background: var(--accent-h); }
  .btn-accent:disabled { background: #2a2a40; color: #555; cursor: default; transform: none; }
  html[data-theme="light"] .btn-accent:disabled { background: #d9d9e0; color: #a5a5b0; }
  .btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--surface2); color: var(--text); }

  .toggle { display: inline-flex; align-items: center; gap: 7px; height: 32px; font-size: 12.5px; color: var(--text-dim); cursor: pointer; user-select: none; transition: color 0.12s; }
  .toggle:hover { color: var(--text); }
  .toggle input { appearance: none; -webkit-appearance: none; width: 16px; height: 16px; flex-shrink: 0; margin: 0; border: 1px solid var(--border); border-radius: 5px; background: var(--surface2); cursor: pointer; position: relative; transition: background 0.12s, border-color 0.12s; }
  .toggle input:hover { border-color: var(--accent); }
  .toggle input:checked { background: var(--accent); border-color: var(--accent); }
  .toggle input:checked::after { content: ""; position: absolute; left: 4.5px; top: 1.5px; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
</style>
</head>
<body>
<div class="wrap">

  <div class="app-header">
    <div class="app-header-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0l-7.2-7.2a2 2 0 0 1-.6-1.4V4a1 1 0 0 1 1-1h8a2 2 0 0 1 1.4.6l7.4 7.4a2 2 0 0 1 0 2.8z"/>
        <circle cx="7.5" cy="7.5" r="1.2" fill="currentColor" stroke="none"/>
      </svg>
    </div>
    <h1>Tag Extractor</h1>
    <button class="theme-btn" id="themeBtn" title="Toggle light / dark theme">
      <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>

  <div class="grid">

    <!-- Input -->
    <div class="panel">
      <div class="panel-head">
        <span class="label">Paste Here</span>
      </div>
      <textarea id="input" spellcheck="false"></textarea>
      <div class="toolbar">
        <button class="btn btn-ghost" id="clearBtn">Clear</button>
      </div>
    </div>

    <!-- Output -->
    <div class="panel">
      <div class="panel-head">
        <span class="label">Unique Tags</span>
        <div class="spacer"></div>
        <span class="count" id="uniqueCount">0</span>
      </div>
      <div class="output" id="output">
        <div class="empty" id="empty"></div>
      </div>
      <div class="toolbar">
        <button class="btn btn-accent" id="copyBtn" disabled>Copy tags</button>
        <label class="toggle"><input type="checkbox" id="sortToggle" /> Sort A&ndash;Z</label>
      </div>
    </div>

  </div>

</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const input       = $("#input");
  const output      = $("#output");
  const empty       = $("#empty");
  const uniqueCount = $("#uniqueCount");
  const copyBtn     = $("#copyBtn");
  const clearBtn    = $("#clearBtn");
  const sortToggle  = $("#sortToggle");

  const TAG_RE = /<[^<>]+>/g;

  function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  let currentTags = [];   // unique tags, in first-seen order

  function render() {
    const matches = input.value.match(TAG_RE) || [];
    const seen = new Set();
    currentTags = [];
    for (const raw of matches) {
      const t = raw.trim();
      if (!seen.has(t)) { seen.add(t); currentTags.push(t); }
    }

    if (sortToggle.checked) currentTags.sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" }));

    uniqueCount.textContent = currentTags.length;
    copyBtn.disabled = currentTags.length === 0;

    if (!currentTags.length) {
      output.innerHTML = "";
      output.appendChild(empty);
      empty.textContent = input.value.trim() ? "No tags found" : "";
      return;
    }
    output.innerHTML = '<div class="taglist">' + currentTags.map(esc).join("\n") + '</div>';
  }

  input.addEventListener("input", render);
  sortToggle.addEventListener("change", render);
  clearBtn.addEventListener("click", () => { input.value = ""; render(); input.focus(); });

  copyBtn.addEventListener("click", async () => {
    if (!currentTags.length) return;
    try {
      await navigator.clipboard.writeText(currentTags.join("\n"));
      const old = copyBtn.textContent;
      copyBtn.textContent = "Copied!";
      setTimeout(() => { copyBtn.textContent = old; }, 1200);
    } catch {}
  });

  // ── Theme ──
  const themeBtn = $("#themeBtn");
  function applyTheme(theme) {
    const t = theme === "light" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t);
    try { localStorage.setItem("tagx.theme", t); } catch {}
  }
  themeBtn.addEventListener("click", () => {
    applyTheme(document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light");
  });
  (function initTheme() {
    let saved = "dark";
    try { saved = localStorage.getItem("tagx.theme") || "dark"; } catch {}
    applyTheme(saved);
  })();

  render();
  input.focus();
})();
</script>
</body>
</html>
